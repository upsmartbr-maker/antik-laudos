<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa Antik - Acesso Administrativo</title>
  
  <!-- Tipografia Editorial Clássica -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --marfim-bg: #F7F4EE;
      --marfim-card: #FDFCF9;
      --bordo-nobre: #8B1E23;
      --bordo-hover: #701418;
      --dourado: #D4AF37;
      --dourado-claro: #EED789;
      --dourado-borda: rgba(212, 175, 55, 0.45);
      --texto-escuro: #2A2322;
      --texto-suave: #6E6260;
      --erro-bg: #FDE8E8;
      --erro-borda: #E02424;
      --shadow-elegante: 0 15px 35px rgba(139, 30, 35, 0.08), 0 5px 15px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--marfim-bg);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(212, 175, 55, 0.06) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(139, 30, 35, 0.05) 0%, transparent 50%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--texto-escuro);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    /* Card Principal com Moldura Nobre */
    .login-card {
      background: var(--marfim-card);
      border-radius: 12px;
      padding: 44px 38px;
      box-shadow: var(--shadow-elegante);
      border: 1px solid var(--dourado-borda);
      position: relative;
    }

    .login-card::before {
      content: "";
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      bottom: 6px;
      border: 1px solid rgba(212, 175, 55, 0.22);
      border-radius: 8px;
      pointer-events: none;
    }

    /* Cabeçalho */
    .brand-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-seal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FAF4E6 0%, #F5E8C9 100%);
      border: 1px solid var(--dourado);
      color: var(--bordo-nobre);
      margin-bottom: 14px;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.25);
    }

    .brand-seal svg {
      width: 28px;
      height: 28px;
      fill: var(--bordo-nobre);
    }

    .brand-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--bordo-nobre);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .brand-subtitle {
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--dourado);
      font-weight: 600;
      margin-top: 4px;
    }

    .brand-divider {
      height: 1px;
      width: 60px;
      background: linear-gradient(to right, transparent, var(--dourado), transparent);
      margin: 12px auto 0;
    }

    /* Alerta de Erro */
    .alert-error {
      background-color: var(--erro-bg);
      border-left: 3px solid var(--erro-borda);
      color: #9B1C1C;
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 13.5px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Formulário */
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--texto-suave);
      margin-bottom: 7px;
    }

    .form-input {
      width: 100%;
      padding: 13px 15px;
      font-size: 14.5px;
      font-family: inherit;
      color: var(--texto-escuro);
      background-color: #FFFFFF;
      border: 1px solid #DFD8CD;
      border-radius: 6px;
      transition: all 0.25s ease;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--bordo-nobre);
      box-shadow: 0 0 0 3px rgba(139, 30, 35, 0.12);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      background: linear-gradient(135deg, var(--bordo-nobre) 0%, #6E151A 100%);
      color: #FFFFFF;
      border: 1px solid var(--dourado);
      border-radius: 6px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 14px rgba(139, 30, 35, 0.22);
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, var(--bordo-hover) 0%, #560F13 100%);
      box-shadow: 0 6px 18px rgba(139, 30, 35, 0.32);
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .footer-links {
      text-align: center;
      margin-top: 24px;
    }

    .back-link {
      color: var(--texto-suave);
      font-size: 13px;
      text-decoration: none;
      transition: color 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .back-link:hover {
      color: var(--bordo-nobre);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      
      <!-- Brasão e Título Casa Antik -->
      <div class="brand-header">
        <div class="brand-seal">
          <svg viewBox="0 0 24 24">
            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
          </svg>
        </div>
        <h1 class="brand-title">Casa Antik</h1>
        <div class="brand-subtitle">Gestão Administrativa</div>
        <div class="brand-divider"></div>
      </div>

      <!-- Exibição de Mensagens de Erro -->
      {% if erro %}
      <div class="alert-error">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
        </svg>
        <span>{{ erro }}</span>
      </div>
      {% endif %}

      <!-- Formulário de Login -->
      <form action="/admin/login" method="POST">
        <div class="form-group">
          <label class="form-label" for="email">E-mail Administrativo</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-input" 
            placeholder="admin@casaantik.com.br" 
            required 
            autocomplete="email"
            autofocus
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Senha de Acesso</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-input" 
            placeholder="••••••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn-submit">
          Autenticar no Painel
        </button>
      </form>

      <div class="footer-links" style="display: flex; flex-direction: column; gap: 8px;">
        <a href="/login" class="back-link">
          🔑 Portal do Cliente / Gerador de Laudos
        </a>
        <a href="/" class="back-link">
          ← Voltar à Página Principal
        </a>
      </div>

    </div>
  </div>

</body>
</html>
